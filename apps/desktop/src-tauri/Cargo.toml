[package]
name = "lumora"
version = "0.1.0"
description = "Lumora — light up your literature."
authors = ["Lumora"]
edition = "2021"

[lib]
name = "lumora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
