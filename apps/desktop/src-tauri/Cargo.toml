[package]
name = "lumora"
version = "0.1.0"
description = "lumora — light up your literature."
authors = ["lumora"]
edition = "2021"

[lib]
name = "lumora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
percent-encoding = "2"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
http = "0.2"
httpdate = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json", "socks"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2"] }
block2 = "0.6"
