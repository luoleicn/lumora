[package]
name = "lumora"
version = "0.1.0"
description = "lumora — light up your literature."
authors = ["lumora"]
edition = "2021"

[lib]
name = "lumora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2"] }
block2 = "0.6"
