name: Release

# Build macOS (arm64 + x64 DMG), Linux (deb + AppImage) and Windows (msi + nsis)
# artifacts and publish them to a single GitHub Release.
#
# Triggered by pushing a version tag (vX.Y.Z), or manually via the Actions tab
# with an explicit tag. The three build jobs reuse the same, already-tested
# build/packaging logic that the local release scripts use (via --build-only),
# so CI and local builds stay in sync.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # Tag name: the pushed tag for `push`, or the manual input for `workflow_dispatch`.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    name: Build macOS (arm64 + x64 DMG)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Validate updater public key
        run: '! grep -q "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" apps/desktop/src-tauri/tauri.conf.json'
      - name: Build and stage DMGs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/release-macos.sh --tag "$TAG" --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: .release-artifacts/*
          if-no-files-found: error
          # .release-artifacts is a dotfile dir; without this v4 skips its contents.
          include-hidden-files: true

  build-linux:
    name: Build Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsecret-1-dev librsvg2-dev \
            build-essential libssl-dev patchelf file
      - run: npm ci
      - name: Validate updater public key
        run: '! grep -q "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY" apps/desktop/src-tauri/tauri.conf.json'
      - name: Build and stage deb + AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/release-linux.sh --tag "$TAG" --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: .release-artifacts/*
          if-no-files-found: error
          # .release-artifacts is a dotfile dir; without this v4 skips its contents.
          include-hidden-files: true

  build-windows:
    name: Build Windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Validate updater public key
        shell: pwsh
        run: |
          if (Select-String -Quiet -Path apps/desktop/src-tauri/tauri.conf.json -Pattern "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY") {
            throw "Replace the updater public-key placeholder before releasing."
          }
      - name: Prepare release version
        run: node scripts/release-version.mjs "$env:TAG"
      - name: Build Windows bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build:windows --workspace @lumora/desktop -- --config src-tauri/tauri.release.conf.json
      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG
          New-Item -ItemType Directory -Force -Path .release-artifacts | Out-Null
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $msi) { throw "No .msi found under $bundle/msi" }
          if (-not $exe) { throw "No NSIS -setup.exe found under $bundle/nsis" }
          $version = $tag -replace '^v', ''
          if ($msi.Name -notlike "*$version*") { throw "MSI filename does not contain release version $version`: $($msi.Name)" }
          if ($exe.Name -notlike "*$version*") { throw "NSIS filename does not contain release version $version`: $($exe.Name)" }
          foreach ($installer in @($msi, $exe)) {
            if (-not (Test-Path "$($installer.FullName).sig")) {
              npx tauri signer sign "$($installer.FullName)"
              if ($LASTEXITCODE -ne 0) { throw "Could not sign $($installer.FullName)" }
            }
          }
          $msiTarget = ".release-artifacts/lumora-$tag-windows-x64.msi"
          $exeTarget = ".release-artifacts/lumora-$tag-windows-x64-setup.exe"
          Copy-Item $msi $msiTarget
          Copy-Item "$($msi.FullName).sig" "$msiTarget.sig"
          Copy-Item $exe $exeTarget
          Copy-Item "$($exe.FullName).sig" "$exeTarget.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: .release-artifacts/*
          if-no-files-found: error
          # .release-artifacts is a dotfile dir; without this v4 skips its contents.
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft and upload signed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Assets to publish:"
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — refreshing its assets."
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" \
              --title "lumora $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --draft
          fi
          gh release upload "$TAG" artifacts/* --clobber
          gh release view "$TAG" --json body --jq .body > release-notes.md
          node scripts/generate-updater-manifest.mjs \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --artifacts artifacts \
            --notes-file release-notes.md \
            --output artifacts/latest.json
          gh release upload "$TAG" artifacts/latest.json --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
