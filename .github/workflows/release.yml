name: Release

# Build macOS (arm64 + x64 DMG), Linux (deb + AppImage) and Windows (msi + nsis)
# artifacts and publish them to a single GitHub Release.
#
# Triggered by pushing a version tag (vX.Y.Z), or manually via the Actions tab
# with an explicit tag. The three build jobs reuse the same, already-tested
# build/packaging logic that the local release scripts use (via --build-only),
# so CI and local builds stay in sync.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tag name: the pushed tag for `push`, or the manual input for `workflow_dispatch`.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build-macos:
    name: Build macOS (arm64 + x64 DMG)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build and stage DMGs
        run: bash scripts/release-macos.sh --tag "$TAG" --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: .release-artifacts/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (deb + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsecret-1-dev librsvg2-dev \
            build-essential libssl-dev patchelf file
      - run: npm ci
      - name: Build and stage deb + AppImage
        run: bash scripts/release-linux.sh --tag "$TAG" --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: .release-artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build Windows bundles
        run: npm run tauri:build:windows --workspace @lumora/desktop
      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $tag = $env:TAG
          New-Item -ItemType Directory -Force -Path .release-artifacts | Out-Null
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          $exe = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $msi) { throw "No .msi found under $bundle/msi" }
          if (-not $exe) { throw "No NSIS -setup.exe found under $bundle/nsis" }
          Copy-Item $msi ".release-artifacts/lumora-$tag-windows-x64.msi"
          Copy-Item $exe ".release-artifacts/lumora-$tag-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: .release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Assets to publish:"
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" \
              --title "lumora $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              artifacts/*
          fi
