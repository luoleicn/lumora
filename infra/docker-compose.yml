services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumora
      POSTGRES_PASSWORD: lumora
      POSTGRES_DB: lumora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumora
      MINIO_ROOT_PASSWORD: lumora-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql://lumora:lumora@postgres:5432/lumora?schema=public
      PORT: 3838
      JWT_SECRET: change-this-in-production
      LUMORA_BOOTSTRAP_EMAIL: reader@example.com
      LUMORA_BOOTSTRAP_PASSWORD: change-me
      APP_BASE_URL: http://localhost:3838
      CLIENT_BASE_URL: http://localhost:5173
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: lumora
      S3_ACCESS_KEY_ID: lumora
      S3_SECRET_ACCESS_KEY: lumora-secret
    ports:
      - "3838:3838"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"

volumes:
  postgres_data:
  minio_data:
